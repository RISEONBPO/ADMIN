<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISEON – Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f6;
            padding: 40px 20px;
            color: #1a1a2e;
        }
        .container { max-width:1200px; margin:0 auto; }
        .header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:30px; flex-wrap:wrap; gap:16px;
        }
        .header h1 {
            font-size:2rem; font-weight:800;
            background:linear-gradient(135deg,#1a237e,#283593);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header .brand-sub {
            font-size:0.8rem; font-weight:500; color:#f7b731;
            letter-spacing:0.2em; text-transform:uppercase; display:block;
            -webkit-text-fill-color:#f7b731;
        }
        .header .stats {
            background:#fff; padding:10px 20px; border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.04); font-weight:600; font-size:0.95rem;
        }
        .header .stats span { color:#1a237e; font-size:1.2rem; }
        .btn-refresh {
            background:#1a237e; color:#fff; border:none; padding:10px 24px;
            border-radius:12px; font-weight:600; cursor:pointer;
            font-family:'Inter',sans-serif; transition:background 0.2s;
        }
        .btn-refresh:hover { background:#283593; }
        .table-wrap {
            background:#fff; border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,0.04);
            overflow-x:auto; padding:4px 0;
        }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th {
            background:#1a237e; color:#fff; text-align:left;
            padding:14px 18px; font-weight:600; white-space:nowrap;
        }
        td { padding:12px 18px; border-bottom:1px solid #edf2f7; }
        tr:hover td { background:#f8faff; }
        .empty-msg { padding:50px; text-align:center; color:#9ca3af; font-size:1.1rem; }
        .loading-msg { padding:50px; text-align:center; color:#1a237e; font-size:1.1rem; }
        .loading-msg .spinner {
            display:inline-block; width:24px; height:24px;
            border:3px solid rgba(26,35,126,0.2); border-radius:50%;
            border-top-color:#1a237e; animation:spin 0.8s linear infinite;
            vertical-align:middle; margin-right:12px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.5);
            backdrop-filter:blur(6px); display:flex; align-items:center;
            justify-content:center; z-index:9999;
        }
        .modal-box {
            background:#fff; padding:40px 32px; border-radius:24px;
            max-width:400px; width:90%; text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-box .logo {
            font-size:2rem; font-weight:800;
            background:linear-gradient(135deg,#1a237e,#283593);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; margin-bottom:4px;
        }
        .modal-box .logo-sub {
            font-size:0.7rem; color:#f7b731; letter-spacing:0.3em;
            text-transform:uppercase; display:block;
            -webkit-text-fill-color:#f7b731; margin-bottom:20px;
        }
        .modal-box h2 { font-size:1.2rem; font-weight:600; margin-bottom:6px; color:#1a1a2e; }
        .modal-box p { color:#6b7280; font-size:0.9rem; margin-bottom:20px; }
        .modal-box input {
            width:100%; padding:14px 16px; border:1.5px solid #e5e7eb;
            border-radius:14px; font-size:1rem; font-family:'Inter',sans-serif;
            margin-bottom:16px; outline:none; transition:border-color 0.2s;
        }
        .modal-box input:focus { border-color:#1a237e; box-shadow:0 0 0 4px rgba(26,35,126,0.08); }
        .modal-box button {
            width:100%; padding:14px; background:linear-gradient(135deg,#1a237e,#283593);
            color:#fff; border:none; border-radius:14px; font-size:1rem;
            font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
            transition:transform 0.2s, box-shadow 0.2s;
        }
        .modal-box button:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(26,35,126,0.25); }
        .modal-box .error { color:#ef4444; font-size:0.85rem; margin-top:8px; display:none; }

        @media (max-width:640px) {
            body { padding:20px 12px; }
            .header { flex-direction:column; align-items:stretch; text-align:center; }
            .header h1 { font-size:1.6rem; }
            .btn-refresh { width:100%; }
            th, td { padding:10px 12px; font-size:0.75rem; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN MODAL ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <div class="logo">RISEON</div>
            <span class="logo-sub">Admin Dashboard</span>
            <h2>🔐 Admin Access</h2>
            <p>Enter the admin password to view all applications.</p>
            <input type="password" id="passwordInput" placeholder="Enter password" autofocus />
            <button id="loginBtn">Unlock Dashboard</button>
            <div class="error" id="loginError">❌ Incorrect password. Try again.</div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div class="container" id="dashboard" style="display:none;">
        <div class="header">
            <div>
                <h1>📋 RISEON <span class="brand-sub">Admin Dashboard</span></h1>
            </div>
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <div class="stats">📊 Total Applications: <span id="totalCount">0</span></div>
                <button class="btn-refresh" id="refreshBtn">🔄 Refresh</button>
            </div>
        </div>

        <div class="table-wrap" id="tableWrap">
            <div class="loading-msg"><span class="spinner"></span> Loading data from central database…</div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ============================================ -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 1. CONFIGURATION
        // ============================================================
        const ADMIN_PASSWORD = 'maalik1'; // <-- CHANGE THIS PASSWORD

        // ⬇️ YOUR GOOGLE APPS SCRIPT URL (INSERTED) ⬇️
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsg6W06f9TpQAkbxu2o9BsMw3wqyCgjREdE7-Qp9pAakcKDSUcQlBbGMJjQeyN9Yo/exec';

        // ============================================================
        // 2. AUTHENTICATION
        // ============================================================
        const loginModal = document.getElementById('loginModal');
        const dashboard = document.getElementById('dashboard');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        function attemptLogin() {
            const entered = passwordInput.value.trim();
            if (entered === ADMIN_PASSWORD) {
                loginModal.style.display = 'none';
                dashboard.style.display = 'block';
                fetchData();
            } else {
                loginError.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        loginBtn.addEventListener('click', attemptLogin);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        // ============================================================
        // 3. FETCH DATA FROM CENTRAL SHEET (via Apps Script GET)
        // ============================================================
        function fetchData() {
            const wrap = document.getElementById('tableWrap');
            wrap.innerHTML = `<div class="loading-msg"><span class="spinner"></span> Loading data from central database…</div>`;

            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        wrap.innerHTML = `<div class="empty-msg">⚠️ Error: ${data.error}</div>`;
                        return;
                    }
                    if (!Array.isArray(data)) {
                        wrap.innerHTML = `<div class="empty-msg">⚠️ Unexpected data format.</div>`;
                        return;
                    }
                    document.getElementById('totalCount').textContent = data.length;
                    if (data.length === 0) {
                        wrap.innerHTML = `<div class="empty-msg">📭 No applications submitted yet.</div>`;
                        return;
                    }
                    const headers = Object.keys(data[0]);
                    let html = `<table><thead><tr>`;
                    headers.forEach(h => html += `<th>${h}</th>`);
                    html += `</tr></thead><tbody>`;
                    data.forEach(row => {
                        html += `<tr>`;
                        headers.forEach(h => {
                            const val = row[h] || '';
                            html += `<td>${escapeHtml(val)}</td>`;
                        });
                        html += `</tr>`;
                    });
                    html += `</tbody></table>`;
                    wrap.innerHTML = html;
                })
                .catch(error => {
                    wrap.innerHTML = `
                        <div class="empty-msg">
                            ⚠️ Failed to load data. Make sure the Apps Script is deployed correctly.<br>
                            <small style="color:#9ca3af;">Error: ${error.message}</small>
                        </div>
                    `;
                });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 4. REFRESH BUTTON
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            fetchData();
            this.textContent = '✅ Refreshed!';
            setTimeout(() => { this.textContent = '🔄 Refresh'; }, 1200);
        });
    </script>
</body>
</html>
